<!doctype html>
<html lang="en" class="scheme-light-dark antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0a09" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://rsms.me/" crossorigin />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <title>tldl</title>
  </head>
  <body
    class="isolate flex min-h-dvh flex-col bg-white text-taupe-950 dark:bg-taupe-950 dark:text-white"
  >
    <header class="mx-auto flex w-full max-w-xl items-center justify-between gap-4 px-6 pt-6">
      <h1 class="text-lg font-semibold">tldl</h1>
      <button
        id="open-settings"
        type="button"
        class="relative -m-1 rounded-md p-1 text-taupe-500 hover:text-taupe-950 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 dark:text-taupe-400 dark:hover:text-white"
      >
        <span
          class="pointer-fine:hidden absolute top-1/2 left-1/2 size-[max(100%,3rem)] -translate-1/2"
          aria-hidden="true"
        ></span>
        <svg viewBox="0 0 16 16" class="size-4 fill-current" aria-hidden="true">
          <path
            fill-rule="evenodd"
            d="M6.455 1.45A.5.5 0 0 1 6.952 1h2.096a.5.5 0 0 1 .497.45l.186 1.858a4.996 4.996 0 0 1 1.466.848l1.703-.769a.5.5 0 0 1 .639.206l1.047 1.814a.5.5 0 0 1-.14.656l-1.517 1.09a5.026 5.026 0 0 1 0 1.694l1.516 1.09a.5.5 0 0 1 .141.656l-1.047 1.814a.5.5 0 0 1-.639.206l-1.703-.768c-.433.36-.928.649-1.466.847l-.186 1.858a.5.5 0 0 1-.497.45H6.952a.5.5 0 0 1-.497-.45l-.186-1.858a4.993 4.993 0 0 1-1.466-.848l-1.703.769a.5.5 0 0 1-.639-.206l-1.047-1.814a.5.5 0 0 1 .14-.656l1.517-1.09a5.033 5.033 0 0 1 0-1.694l-1.516-1.09a.5.5 0 0 1-.141-.656L2.46 3.593a.5.5 0 0 1 .639-.206l1.703.769c.433-.36.928-.65 1.466-.848l.186-1.858Zm-.177 7.567-.022-.037a2 2 0 0 1 3.466-1.997l.022.037a2 2 0 0 1-3.466 1.997Z"
            clip-rule="evenodd"
          />
        </svg>
        <span class="sr-only">Settings</span>
      </button>
    </header>

    <main class="mx-auto flex w-full max-w-xl flex-1 flex-col gap-6 px-6 py-10">
      <p
        id="hint"
        role="status"
        hidden
        class="max-w-[65ch] rounded-lg bg-taupe-100 px-3 py-2 text-base/6 text-pretty text-taupe-700 sm:text-sm/6 dark:bg-white/5 dark:text-taupe-300"
      ></p>

      <section id="view-idle" hidden>
        <h2 class="text-lg font-medium text-balance">Nothing to read yet</h2>
        <p class="mt-2 max-w-[56ch] text-base/7 text-pretty text-taupe-600 dark:text-taupe-400">
          Share a voice message from WhatsApp and it lands here. Or pick one off this device.
        </p>
        <input
          id="file-input"
          name="audio"
          type="file"
          accept="audio/*,.opus,.ogg,.m4a,.mp3"
          class="peer sr-only"
        />
        <label
          for="file-input"
          class="mt-6 inline-flex w-full max-w-xs cursor-pointer items-center justify-center gap-2 rounded-lg bg-taupe-950 py-2 pr-3 pl-2 text-sm/5 font-medium text-white peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-blue-500 hover:bg-taupe-800 dark:bg-white dark:text-taupe-950 dark:hover:bg-taupe-200"
        >
          <svg viewBox="0 0 16 16" class="size-4 shrink-0 fill-current" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M11.914 4.086a2 2 0 0 0-2.828 0l-5 5a2 2 0 1 0 2.828 2.828l.556-.555a.75.75 0 0 1 1.06 1.06l-.555.556a3.5 3.5 0 0 1-4.95-4.95l5-5a3.5 3.5 0 0 1 4.95 4.95l-1.972 1.972a2.125 2.125 0 0 1-3.006-3.005L9.97 4.97a.75.75 0 1 1 1.06 1.06L9.058 8.003a.625.625 0 0 0 .884.883l1.972-1.972a2 2 0 0 0 0-2.828Z"
              clip-rule="evenodd"
            />
          </svg>
          Pick a file
        </label>
      </section>

      <section id="view-working" role="status" aria-live="polite" hidden>
        <div class="flex items-center gap-3">
          <div
            class="size-4 shrink-0 animate-spin rounded-full border-2 border-taupe-950/15 border-t-taupe-950 dark:border-white/15 dark:border-t-white"
            aria-hidden="true"
          ></div>
          <p id="working-step" class="text-base/6 font-medium sm:text-sm/6"></p>
        </div>
        <p
          id="working-detail"
          class="mt-2 text-base/6 tabular-nums text-taupe-500 sm:text-sm/6 dark:text-taupe-400"
        ></p>
      </section>

      <section id="view-result" hidden>
        <p id="result-text" class="max-w-[65ch] text-base/7 whitespace-pre-wrap text-pretty"></p>

        <div id="result-actions" class="mt-6 flex flex-wrap items-center gap-3">
          <button
            id="copy"
            type="button"
            class="inline-flex items-center gap-2 rounded-lg bg-taupe-950 py-2 pr-3 pl-2 text-sm/5 font-medium text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 hover:bg-taupe-800 dark:bg-white dark:text-taupe-950 dark:hover:bg-taupe-200"
          >
            <svg viewBox="0 0 16 16" class="size-4 shrink-0 fill-current" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M10.986 3H12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h1.014A2.25 2.25 0 0 1 7.25 1h1.5a2.25 2.25 0 0 1 2.236 2ZM9.5 4v-.75a.75.75 0 0 0-.75-.75h-1.5a.75.75 0 0 0-.75.75V4h3Z"
                clip-rule="evenodd"
              />
            </svg>
            <span id="copy-label">Copy</span>
          </button>
          <button
            id="again"
            type="button"
            class="inline-flex items-center gap-1.5 rounded-lg py-1 pr-2.5 pl-1.5 text-sm/5 font-medium ring-1 ring-taupe-950/15 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 hover:bg-taupe-100 dark:ring-white/15 dark:hover:bg-white/5"
          >
            <svg viewBox="0 0 16 16" class="size-4 shrink-0 fill-current" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M13.836 2.477a.75.75 0 0 1 .75.75v3.182a.75.75 0 0 1-.75.75h-3.182a.75.75 0 0 1 0-1.5h1.37l-.84-.841a4.5 4.5 0 0 0-7.08.932.75.75 0 0 1-1.3-.75 6 6 0 0 1 9.44-1.242l.842.84V3.227a.75.75 0 0 1 .75-.75Zm-.911 7.5A.75.75 0 0 1 13.199 11a6 6 0 0 1-9.44 1.241l-.84-.84v1.371a.75.75 0 0 1-1.5 0V9.591a.75.75 0 0 1 .75-.75H5.35a.75.75 0 0 1 0 1.5H3.98l.841.841a4.5 4.5 0 0 0 7.08-.932.75.75 0 0 1 1.025-.273Z"
                clip-rule="evenodd"
              />
            </svg>
            New
          </button>
        </div>

        <details
          id="result-original"
          class="group mt-8 border-t border-taupe-950/10 pt-4 dark:border-white/10"
        >
          <summary
            class="flex cursor-pointer list-none items-center gap-2 text-base/6 font-medium sm:text-sm/6 [&::-webkit-details-marker]:hidden"
          >
            <svg
              viewBox="0 0 16 16"
              class="size-4 shrink-0 fill-taupe-400 transition-transform group-open:rotate-90"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M6.22 4.22a.75.75 0 0 1 1.06 0l3.25 3.25a.75.75 0 0 1 0 1.06l-3.25 3.25a.75.75 0 0 1-1.06-1.06L8.94 8 6.22 5.28a.75.75 0 0 1 0-1.06Z"
                clip-rule="evenodd"
              />
            </svg>
            Original transcript
          </summary>
          <p
            id="result-transcript"
            class="mt-3 max-w-[65ch] text-base/7 whitespace-pre-wrap text-pretty text-taupe-600 dark:text-taupe-400"
          ></p>
        </details>

        <p
          id="result-stats"
          class="mt-6 flex flex-wrap items-center gap-x-2 text-base/6 tabular-nums text-taupe-500 sm:text-sm/6 dark:text-taupe-400"
        >
          <span id="result-spoken" hidden></span>
          <span id="result-spoken-separator" aria-hidden="true" hidden>·</span>
          <span id="result-reduction"></span>
          <span aria-hidden="true">·</span>
          <span>Cost <span id="result-meta"></span></span>
        </p>
      </section>

      <section id="view-error" role="alert" hidden>
        <div class="flex items-start gap-2 text-base/7">
          <svg
            viewBox="0 0 16 16"
            class="size-4 h-lh shrink-0 fill-red-600 dark:fill-red-400"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M6.701 2.25c.577-1 2.02-1 2.598 0l5.196 9a1.5 1.5 0 0 1-1.299 2.25H2.804a1.5 1.5 0 0 1-1.3-2.25l5.197-9ZM8 4a.75.75 0 0 1 .75.75v3a.75.75 0 1 1-1.5 0v-3A.75.75 0 0 1 8 4Zm0 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
              clip-rule="evenodd"
            />
          </svg>
          <p id="error-text" class="max-w-[65ch] text-pretty"></p>
        </div>
        <button
          id="error-back"
          type="button"
          class="mt-6 inline-flex items-center rounded-lg px-2.5 py-1 text-sm/5 font-medium ring-1 ring-taupe-950/15 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 hover:bg-taupe-100 dark:ring-white/15 dark:hover:bg-white/5"
        >
          Back
        </button>
      </section>

      <section id="view-settings" hidden>
        <h2 class="text-lg font-medium">Settings</h2>

        <div class="mt-6 flex max-w-xs flex-col gap-5">
          <div>
            <label for="api-key" class="block text-base/7 font-medium sm:text-sm/6"
              >OpenRouter API key</label
            >
            <input
              id="api-key"
              name="api-key"
              type="password"
              autocomplete="off"
              spellcheck="false"
              class="mt-1.5 block w-full rounded-lg bg-white px-3 py-2 text-base/6 outline-1 -outline-offset-1 outline-taupe-950/15 placeholder:text-taupe-400 focus:outline-2 focus:-outline-offset-1 focus:outline-blue-500 sm:text-sm/6 dark:bg-white/5 dark:outline-white/10"
            />
            <p class="mt-2 text-base/6 text-pretty text-taupe-500 sm:text-sm/6 dark:text-taupe-400">
              Kept in this browser only, and sent only to openrouter.ai.
            </p>
          </div>

          <div>
            <span id="output-language-label" class="block text-base/7 font-medium sm:text-sm/6"
              >Output language</span
            >
            <div
              id="output-language"
              role="group"
              aria-labelledby="output-language-label"
              class="mt-1.5 inline-flex gap-1 rounded-lg bg-taupe-100 p-1 dark:bg-white/5"
            >
              <button
                type="button"
                data-language="en"
                aria-pressed="true"
                class="rounded-md px-3 py-1.5 text-base/6 font-medium text-taupe-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 sm:text-sm/6 aria-pressed:bg-white aria-pressed:text-taupe-950 aria-pressed:shadow-sm dark:text-taupe-400 dark:aria-pressed:bg-white/10 dark:aria-pressed:text-white"
              >
                English
              </button>
              <button
                type="button"
                data-language="de"
                aria-pressed="false"
                class="rounded-md px-3 py-1.5 text-base/6 font-medium text-taupe-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 sm:text-sm/6 aria-pressed:bg-white aria-pressed:text-taupe-950 aria-pressed:shadow-sm dark:text-taupe-400 dark:aria-pressed:bg-white/10 dark:aria-pressed:text-white"
              >
                German
              </button>
            </div>
            <p class="mt-2 text-base/6 text-pretty text-taupe-500 sm:text-sm/6 dark:text-taupe-400">
              The rewrite lands in this language, whatever was spoken.
            </p>
          </div>
        </div>

        <div class="mt-8 flex items-center gap-3">
          <button
            id="save-settings"
            type="button"
            class="inline-flex items-center rounded-lg bg-taupe-950 px-3 py-2 text-sm/5 font-medium text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 hover:bg-taupe-800 dark:bg-white dark:text-taupe-950 dark:hover:bg-taupe-200"
          >
            Save
          </button>
          <p
            id="settings-saved"
            hidden
            class="flex items-center gap-1.5 text-base/6 text-taupe-600 sm:text-sm/6 dark:text-taupe-400"
          >
            <svg viewBox="0 0 16 16" class="size-4 h-lh shrink-0 fill-current" aria-hidden="true">
              <path
                fill-rule="evenodd"
                d="M12.416 3.376a.75.75 0 0 1 .208 1.04l-5 7.5a.75.75 0 0 1-1.154.114l-3-3a.75.75 0 0 1 1.06-1.06l2.353 2.353 4.493-6.74a.75.75 0 0 1 1.04-.207Z"
                clip-rule="evenodd"
              />
            </svg>
            Saved
          </p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
